<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Traffic Trencher Balance (USD)</title>
  <style>
    body{margin:0;background:rgba(0,0,0,0);font-family:Arial,sans-serif;color:#fff}
    .box{display:inline-block;background:rgba(0,0,0,.72);border-radius:16px;padding:16px 18px;min-width:340px}
    .label{font-size:14px;opacity:.85;letter-spacing:.2px}
    .usd{font-size:44px;font-weight:1000;margin-top:8px;line-height:1.05}
    .tok{font-size:14px;font-weight:900;margin-top:6px;opacity:.9}
    .sub{font-size:12px;opacity:.7;margin-top:8px}
    .err{font-size:12px;color:#ffb3b3;margin-top:10px;display:none}
  </style>
</head>
<body>
  <div class="box">
    <div class="label">Traffic Trencher Token Balance</div>
    <div class="usd" id="usd">$…</div>
    <div class="tok" id="tok">… tokens</div>
    <div class="sub" id="updated">…</div>
    <div class="err" id="err"></div>
  </div>

<script>
  const WALLET = "CviKehFyefZVe4CV7D5ZoDsmwubtpjwysG4oxxDYPqGP";
  const TOKEN_MINT = "BwWdcMtBRz8R38sbjA3GnkR35wz6z3xz3GFiS1yGpump";

  // Free RPCs (rotate)
  const RPCS = [
    "https://rpc.ankr.com/solana",
    "https://solana-rpc.publicnode.com",
    "https://solana.public-rpc.com"
  ];

  // Jupiter price API (free)
  const JUP_PRICE_URL = (mint) =>
    `https://price.jup.ag/v6/price?ids=${encodeURIComponent(mint)}`;

  // Refresh slower to avoid rate limits in PRISM
  const BASE_REFRESH_MS = 15000; // 15s
  const MAX_BACKOFF_MS = 120000; // 2 min

  let rpcIndex = 0;
  let backoffMs = BASE_REFRESH_MS;

  let lastGood = {
    tokens: null,
    price: null,
    usd: null
  };

  function fmt(n, maxFrac=6){
    return Number(n).toLocaleString(undefined, { maximumFractionDigits: maxFrac });
  }

  function fmtUSD(n){
    return "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  async function rpcCall(url, method, params) {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 8000);

    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }),
        signal: controller.signal
      });
      if (!res.ok) throw new Error(`HTTP ${res.status} from ${url}`);
      const j = await res.json();
      if (j?.error) throw new Error(j.error.message || "RPC error");
      return j;
    } finally {
      clearTimeout(t);
    }
  }

  async function rpc(method, params) {
    let lastErr = null;
    for (let tries = 0; tries < RPCS.length; tries++) {
      const url = RPCS[(rpcIndex + tries) % RPCS.length];
      try {
        const j = await rpcCall(url, method, params);
        rpcIndex = (rpcIndex + tries) % RPCS.length;
        return j;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error("All RPCs failed");
  }

  async function getTokenBalance() {
    const j = await rpc("getTokenAccountsByOwner", [
      WALLET,
      { mint: TOKEN_MINT },
      { encoding: "jsonParsed" }
    ]);

    const accounts = j?.result?.value || [];
    let total = 0;
    for (const acc of accounts) {
      total += acc?.account?.data?.parsed?.info?.tokenAmount?.uiAmount || 0;
    }
    return total;
  }

  async function getTokenPriceUSD() {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 8000);

    try {
      const res = await fetch(JUP_PRICE_URL(TOKEN_MINT), { signal: controller.signal });
      if (!res.ok) throw new Error("Price API failed");
      const j = await res.json();
      const p = j?.data?.[TOKEN_MINT]?.price;
      if (typeof p !== "number") return null;
      return p;
    } finally {
      clearTimeout(t);
    }
  }

  function setUI(data, note, isError=false) {
    const usdEl = document.getElementById("usd");
    const tokEl = document.getElementById("tok");

    if (data?.usd !== null && data?.usd !== undefined) {
      usdEl.textContent = fmtUSD(data.usd);
    } else {
      usdEl.textContent = "$—";
    }

    if (data?.tokens !== null && data?.tokens !== undefined) {
      tokEl.textContent = `${fmt(data.tokens, 6)} tokens`;
    } else {
      tokEl.textContent = "— tokens";
    }

    document.getElementById("updated").textContent = note || "";

    const err = document.getElementById("err");
    if (isError) {
      err.style.display = "block";
      err.textContent = "Update delayed (RPC throttling).";
    } else {
      err.style.display = "none";
      err.textContent = "";
    }
  }

  async function loop() {
    try {
      // Pull balance + price in parallel
      const [tokens, price] = await Promise.all([
        getTokenBalance(),
        getTokenPriceUSD()
      ]);

      // If price API fails, keep last price (better than blank)
      const usePrice = (price !== null && price !== undefined) ? price : lastGood.price;

      const usd = (usePrice !== null && usePrice !== undefined)
        ? (tokens * usePrice)
        : null;

      lastGood = { tokens, price: usePrice, usd };

      backoffMs = BASE_REFRESH_MS;
      setUI(lastGood, "Updated " + new Date().toLocaleTimeString(), false);

    } catch (e) {
      // Keep last good value on screen
      setUI(lastGood, "Retrying… " + new Date().toLocaleTimeString(), true);

      backoffMs = Math.min(MAX_BACKOFF_MS, Math.floor(backoffMs * 1.6));
      rpcIndex = (rpcIndex + 1) % RPCS.length;
    }

    setTimeout(loop, backoffMs);
  }

  loop();
</script>
</body>
</html>
