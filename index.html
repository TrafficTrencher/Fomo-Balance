<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Traffic Trencher Token Balance</title>
  <style>
    body{
      margin:0;
      background: rgba(0,0,0,0);
      font-family: Arial, sans-serif;
      color:#fff;
    }
    .box{
      display:inline-block;
      background: rgba(0,0,0,0.72);
      border-radius: 16px;
      padding: 16px 18px;
      min-width: 320px;
    }
    .label{
      font-size: 14px;
      opacity: 0.85;
      letter-spacing: 0.2px;
    }
    .value{
      font-size: 42px;
      font-weight: 1000;
      margin-top: 8px;
      line-height: 1.05;
    }
    .sub{
      font-size: 12px;
      opacity: 0.7;
      margin-top: 8px;
    }
    .err{
      font-size: 12px;
      color: #ffb3b3;
      margin-top: 10px;
      display:none;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="label">Traffic Trencher Token Balance</div>
    <div class="value" id="bal">…</div>
    <div class="sub" id="updated">…</div>
    <div class="err" id="err"></div>
  </div>

<script>
  const WALLET = "CviKehFyefZVe4CV7D5ZoDsmwubtpjwysG4oxxDYPqGP";

  // ✅ NEW TOKEN MINT
  const TOKEN_MINT = "BwWdcMtBRz8R38sbjA3GnkR35wz6z3xz3GFiS1yGpump";

  // Free RPC fallback (helps when one endpoint blocks/rate-limits)
  const RPCS = [
    "https://rpc.ankr.com/solana",
    "https://api.mainnet-beta.solana.com"
  ];

  const REFRESH_MS = 5000;

  function fmt(n, maxFrac=6){
    return Number(n).toLocaleString(undefined, { maximumFractionDigits: maxFrac });
  }

  async function rpcCall(url, method, params) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const j = await res.json();
    if (j?.error) throw new Error(j.error.message || "RPC error");
    return j;
  }

  async function rpc(method, params) {
    let lastErr = null;
    for (const url of RPCS) {
      try { return await rpcCall(url, method, params); }
      catch (e) { lastErr = e; }
    }
    throw lastErr || new Error("All RPCs failed");
  }

  async function loadTokenBalance() {
    const j = await rpc("getTokenAccountsByOwner", [
      WALLET,
      { mint: TOKEN_MINT },
      { encoding: "jsonParsed" }
    ]);

    const accounts = j?.result?.value || [];
    let total = 0;

    for (const acc of accounts) {
      total += acc?.account?.data?.parsed?.info?.tokenAmount?.uiAmount || 0;
    }

    document.getElementById("bal").textContent = fmt(total, 6);
    document.getElementById("updated").textContent =
      "Updated " + new Date().toLocaleTimeString();
  }

  async function tick() {
    const err = document.getElementById("err");
    err.style.display = "none";
    err.textContent = "";

    try {
      await loadTokenBalance();
    } catch (e) {
      err.style.display = "block";
      err.textContent = "Update failed (RPC rate limit sometimes).";
    }
  }

  tick();
  setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
