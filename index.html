<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wallet Balance</title>
  <style>
    body {
      margin: 0;
      background: rgba(0,0,0,0);
      font-family: Arial, sans-serif;
      color: white;
    }
    .box {
      background: rgba(0,0,0,0.7);
      padding: 14px 18px;
      border-radius: 14px;
      display: inline-block;
      min-width: 240px;
    }
    .label {
      font-size: 14px;
      opacity: 0.8;
    }
    .row {
      margin-top: 8px;
    }
    .value {
      font-size: 30px;
      font-weight: 900;
      margin-top: 2px;
    }
    .updated {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="box">
  <div class="label">WALLET BALANCE</div>

  <div class="row">
    <div class="label">SOL</div>
    <div class="value" id="sol">...</div>
  </div>

  <div class="row">
    <div class="label">FOMO TOKEN</div>
    <div class="value" id="fomo">...</div>
  </div>

  <div class="updated" id="updated"></div>
</div>

<script>
  const WALLET_ADDRESS = "CviKehFyefZVe4CV7D5ZoDsmwubtpjwysG4oxxDYPqGP";
  const TOKEN_MINT = "CfKAMwn3nb6JdEGQAuZQsm7tY8aPJou21CMPTCi6pump";
  const RPC_URL = "https://api.mainnet-beta.solana.com";

  const REFRESH_MS = 5000;

  async function rpc(method, params) {
    const res = await fetch(RPC_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
    });
    return await res.json();
  }

  async function loadSolBalance() {
    const json = await rpc("getBalance", [WALLET_ADDRESS]);
    const lamports = json?.result?.value || 0;
    const sol = lamports / 1_000_000_000;
    document.getElementById("sol").textContent =
      sol.toLocaleString(undefined, { maximumFractionDigits: 4 }) + " SOL";
  }

  async function loadTokenBalance() {
    const json = await rpc("getTokenAccountsByOwner", [
      WALLET_ADDRESS,
      { mint: TOKEN_MINT },
      { encoding: "jsonParsed" }
    ]);

    const accounts = json?.result?.value || [];

    let total = 0;
    for (const acc of accounts) {
      total += acc?.account?.data?.parsed?.info?.tokenAmount?.uiAmount || 0;
    }

    document.getElementById("fomo").textContent =
      total.toLocaleString(undefined, { maximumFractionDigits: 6 });
  }

  async function tick() {
    try {
      await Promise.all([loadSolBalance(), loadTokenBalance()]);
      document.getElementById("updated").textContent =
        "Updated " + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById("updated").textContent = "Refresh failed";
    }
  }

  tick();
  setInterval(tick, REFRESH_MS);
</script>

</body>
</html>
