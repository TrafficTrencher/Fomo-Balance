<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Traffic Trencher Token Balance</title>
  <style>
    body{margin:0;background:rgba(0,0,0,0);font-family:Arial,sans-serif;color:#fff}
    .box{display:inline-block;background:rgba(0,0,0,.72);border-radius:16px;padding:16px 18px;min-width:320px}
    .label{font-size:14px;opacity:.85;letter-spacing:.2px}
    .value{font-size:42px;font-weight:1000;margin-top:8px;line-height:1.05}
    .sub{font-size:12px;opacity:.7;margin-top:8px}
    .err{font-size:12px;color:#ffb3b3;margin-top:10px;display:none}
  </style>
</head>
<body>
  <div class="box">
    <div class="label">Traffic Trencher Token Balance</div>
    <div class="value" id="bal">…</div>
    <div class="sub" id="updated">…</div>
    <div class="err" id="err"></div>
  </div>

<script>
  const WALLET = "CviKehFyefZVe4CV7D5ZoDsmwubtpjwysG4oxxDYPqGP";
  const TOKEN_MINT = "BwWdcMtBRz8R38sbjA3GnkR35wz6z3xz3GFiS1yGpump";

  // Free RPCs (rotate)
  const RPCS = [
    "https://rpc.ankr.com/solana",
    "https://solana-rpc.publicnode.com",
    "https://solana.public-rpc.com"
  ];

  // ✅ Refresh slower to avoid rate limits in PRISM
  const BASE_REFRESH_MS = 15000; // 15s is much safer
  const MAX_BACKOFF_MS = 120000; // cap at 2 min during failures

  let rpcIndex = 0;
  let backoffMs = BASE_REFRESH_MS;
  let lastGood = null;

  function fmt(n, maxFrac=6){
    return Number(n).toLocaleString(undefined, { maximumFractionDigits: maxFrac });
  }

  async function rpcCall(url, method, params) {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 8000); // 8s timeout

    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }),
        signal: controller.signal
      });
      if (!res.ok) throw new Error(`HTTP ${res.status} from ${url}`);
      const j = await res.json();
      if (j?.error) throw new Error(j.error.message || "RPC error");
      return j;
    } finally {
      clearTimeout(t);
    }
  }

  async function rpc(method, params) {
    // try each RPC once, starting from current index
    let lastErr = null;
    for (let tries = 0; tries < RPCS.length; tries++) {
      const url = RPCS[(rpcIndex + tries) % RPCS.length];
      try {
        const j = await rpcCall(url, method, params);
        rpcIndex = (rpcIndex + tries) % RPCS.length; // stick to the one that worked
        return j;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error("All RPCs failed");
  }

  async function getTokenBalance() {
    const j = await rpc("getTokenAccountsByOwner", [
      WALLET,
      { mint: TOKEN_MINT },
      { encoding: "jsonParsed" }
    ]);

    const accounts = j?.result?.value || [];
    let total = 0;
    for (const acc of accounts) {
      total += acc?.account?.data?.parsed?.info?.tokenAmount?.uiAmount || 0;
    }
    return total;
  }

  function setUI(balance, note, isError=false) {
    if (balance !== null && balance !== undefined) {
      document.getElementById("bal").textContent = fmt(balance, 6);
    }
    document.getElementById("updated").textContent = note || "";

    const err = document.getElementById("err");
    if (isError) {
      err.style.display = "block";
      err.textContent = "Update delayed (RPC throttling).";
    } else {
      err.style.display = "none";
      err.textContent = "";
    }
  }

  async function loop() {
    try {
      const bal = await getTokenBalance();
      lastGood = bal;
      backoffMs = BASE_REFRESH_MS; // reset backoff on success
      setUI(bal, "Updated " + new Date().toLocaleTimeString(), false);
    } catch (e) {
      // keep showing the last good number instead of blanking
      setUI(lastGood, "Retrying… " + new Date().toLocaleTimeString(), true);

      // exponential backoff up to cap
      backoffMs = Math.min(MAX_BACKOFF_MS, Math.floor(backoffMs * 1.6));
      // also rotate RPC next time
      rpcIndex = (rpcIndex + 1) % RPCS.length;
    }

    setTimeout(loop, backoffMs);
  }

  loop();
</script>
</body>
</html>
